name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: checkers_db
          POSTGRES_USER: checkers_user
          POSTGRES_PASSWORD: checkers_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Run database migrations
      run: npx prisma db push --skip-generate
      env:
        DATABASE_URL: postgresql://checkers_user:checkers_password@localhost:5432/checkers_db
    
    - name: Run tests
      run: npm test
      env:
        DATABASE_URL: postgresql://checkers_user:checkers_password@localhost:5432/checkers_db
        JWT_SECRET: test-secret-key-minimum-32-characters-long
    
    - name: Run linter
      run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Build application
      run: npm run build
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/checkers_db
        JWT_SECRET: build-secret-key-minimum-32-characters-long
    
    - name: Verify build
      run: |
        if [ ! -d ".next" ]; then
          echo "Build directory not found!"
          exit 1
        fi
        echo "Build successful!"

